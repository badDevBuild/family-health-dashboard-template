name: deploy-demo-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          npm ci
          python -m pip install -r server/requirements-dev.txt
      - name: 重新生成虚构演示数据
        run: |
          npm run generate-demo-data
          git diff --exit-code -- src/lib/health-data.ts
      - name: 执行发布门禁
        run: |
          npm run privacy-check
          npm run lint
          npm run typecheck
          npm run test:scripts
          npm run test
          npm run test:server
      - name: 构建 GitHub Pages 演示产物
        env:
          VITE_BASE: /family-health-dashboard-template/
        run: |
          npm run build-demo
          cp dist-demo/index.html dist-demo/404.html
          npm run privacy-check:demo-artifact
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传演示产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
